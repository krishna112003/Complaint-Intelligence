# Model training configuration
seed: 42

# Primary metric for model selection
primary_metric: "macro_f1"

# TF-IDF settings
tfidf:
  max_features: 50000
  ngram_range: [1, 2]
  sublinear_tf: true
  min_df: 3

# Logistic Regression
logistic_regression:
  C_values: [0.01, 0.1, 1.0, 10.0]
  max_iter: 1000
  class_weight: "balanced"
  solver: "lbfgs"

# Linear SVM
linear_svm:
  C_values: [0.01, 0.1, 1.0, 10.0]
  class_weight: "balanced"
  max_iter: 5000

# Embedding model
embeddings:
  model_name: "all-MiniLM-L6-v2"
  batch_size: 256
  cache_dir: "data/cache/embeddings"

# LightGBM
lightgbm:
  n_estimators: 500
  learning_rate: 0.05
  num_leaves: 63
  max_depth: -1
  min_child_samples: 20
  class_weight: "balanced"
  early_stopping_rounds: 50

# Cross-validation
cv:
  n_splits: 5
  stratified: true
