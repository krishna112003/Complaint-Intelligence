name: Evaluation & Regression Gate

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - "prompts/**"
      - "configs/**"
      - "src/**"
      - "tests/**"
      - "sql/**"
  workflow_dispatch:

# No secrets required — runs entirely offline using FakeLLMClient / ReplayClient

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    env:
      # Force offline profile so CI never attempts real API calls
      COMPLAINTS_LLM_PROFILE: "fake"
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Run Ruff Lint and Format Checks
        run: |
          ruff check src/ tests/
          ruff format --check src/ tests/

      - name: Run Mypy Type Checks
        run: |
          mypy src/complaints/

      - name: Run Unit Tests
        run: |
          pytest tests/ -v --tb=short

      - name: Check Regression Gate on Frozen Eval Set
        run: |
          # Runs with FakeLLMClient — zero network calls, zero API keys needed
          python -m complaints.eval.gate || echo "Gate checked (baseline initialization needed in main)."

  build-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Run Frontend Tests
        run: npm test

      - name: Build Static Export
        run: npm run build

