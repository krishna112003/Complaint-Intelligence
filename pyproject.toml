[project]
name = "complaint-intelligence"
version = "0.1.0"
description = "Complaint Intelligence & LLM Evaluation Pipeline — benchmarking classical ML, transformers and LLMs on CFPB consumer complaints."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "Krishna" }]

dependencies = [
    # Data layer
    "duckdb>=1.1.0,<1.2.0",
    "pandas>=2.2.0,<3.0.0",
    "pyarrow>=18.0.0,<19.0.0",
    # ML
    "scikit-learn>=1.5.0,<1.7.0",
    "lightgbm>=4.5.0,<5.0.0",
    "sentence-transformers>=3.3.0,<4.0.0",
    # Transformers (fine-tune optional)
    "transformers>=4.46.0,<5.0.0",
    "datasets>=3.1.0,<4.0.0",
    "accelerate>=1.1.0,<2.0.0",
    # LLM
    "google-genai>=1.0.0,<3.0.0",
    "pydantic>=2.10.0,<3.0.0",
    # DSPy
    "dspy>=2.6.0,<2.7.0",
    # Topics
    "bertopic>=0.16.0,<0.17.0",
    "umap-learn>=0.5.5,<0.6.0",
    "hdbscan>=0.8.38,<0.9.0",
    # Statistics
    "scipy>=1.14.0,<2.0.0",
    "statsmodels>=0.14.0,<0.15.0",
    "numpy>=1.26.0,<2.0.0",
    # Plotting
    "matplotlib>=3.9.0,<4.0.0",
    "seaborn>=0.13.0,<0.14.0",
    # Tracking
    "mlflow>=2.19.0,<3.0.0",
    # App
    "streamlit>=1.40.0,<2.0.0",
    # Config
    "pyyaml>=6.0.0,<7.0.0",
    "python-dotenv>=1.0.0,<2.0.0",
    # Misc
    "tqdm>=4.66.0,<5.0.0",
    "tenacity>=9.0.0,<10.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.8.0,<1.0.0",
    "mypy>=1.13.0,<2.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "types-PyYAML>=6.0.0",
    "types-tqdm>=4.66.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
